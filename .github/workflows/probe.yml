name: NepCTF 1123 probe

on:
  push:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 1 - 准备
        run: |
          TC=$(command -v gtimeout || command -v timeout || echo "")
          echo "TC=$TC" >> $GITHUB_ENV
          mkdir -p out
          xattr -cr bin/ 2>&1 || true
          codesign -s - --force bin/challenge.bin 2>&1 || true
          chmod +x bin/challenge.bin
          sudo softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true

      - name: 2 - 拦截父进程写入管道的数据 (fd > 2)
        continue-on-error: true
        run: |
          set +e
          ${TC:+$TC 400} lldb -b \
            -o "target create bin/challenge.bin" \
            -o "breakpoint set --name ptrace" \
            -o "process launch -- 'NepCTF{a986e67dd7e9329e518bdba8805c2d4d}'" \
            -o "thread return 0" \
            -o "breakpoint delete 1" \
            -o "breakpoint set --name write" \
            -o "breakpoint modify 2 -c '\$x0 > 2'" \
            -o "breakpoint command add --script-type command -o 'memory read --size 1 --format x --count 48 \$x1' -o 'register read x0 x2' -o 'continue' 2" \
            -o "continue" \
            > out/40-write.txt 2>&1
          head -c 60000 out/40-write.txt

      - name: 3 - 拦截父进程从管道读出的数据
        continue-on-error: true
        run: |
          set +e
          ${TC:+$TC 400} lldb -b \
            -o "target create bin/challenge.bin" \
            -o "breakpoint set --name ptrace" \
            -o "process launch -- 'NepCTF{a986e67dd7e9329e518bdba8805c2d4d}'" \
            -o "thread return 0" \
            -o "breakpoint delete 1" \
            -o "breakpoint set --name read" \
            -o "breakpoint modify 2 -c '\$x0 > 2'" \
            -o "breakpoint command add --script-type command -o 'thread step-out' -o 'memory read --size 1 --format x --count 48 \$x1' -o 'register read x0' -o 'continue' 2" \
            -o "continue" \
            > out/41-read.txt 2>&1
          head -c 60000 out/41-read.txt

      - name: 4 - 拦截 posix_spawn 看启动参数
        continue-on-error: true
        run: |
          set +e
          ${TC:+$TC 400} lldb -b \
            -o "target create bin/challenge.bin" \
            -o "breakpoint set --name ptrace" \
            -o "process launch -- 'NepCTF{a986e67dd7e9329e518bdba8805c2d4d}'" \
            -o "thread return 0" \
            -o "breakpoint delete 1" \
            -o "breakpoint set --name posix_spawn" \
            -o "breakpoint command add --script-type command -o 'memory read --size 1 --format c --count 64 \$x1' -o 'register read x0 x2 x3' -o 'bt' -o 'continue' 2" \
            -o "continue" \
            > out/42-spawn.txt 2>&1
          head -c 40000 out/42-spawn.txt

      - name: 5 - 上传全部输出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-output
          path: out/
