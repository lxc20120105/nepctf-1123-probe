name: NepCTF 1123 probe

on:
  push:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 1 - 准备
        run: |
          mkdir -p out
          xattr -cr bin/ 2>&1 || true
          codesign -s - --force bin/challenge.bin 2>&1 || true
          chmod +x bin/challenge.bin
          sudo softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true

      - name: 2 - 试第三批候选 (VM 输出与派生哈希)
        continue-on-error: true
        run: |
          set +e
          while IFS='|' read -r name flag; do
            [ -z "$name" ] && continue
            OUT=$(./bin/challenge.bin "$flag" < /dev/null 2>&1 | head -2 | tr '\n' ' ')
            printf '%-16s %s -> [%s]\n' "$name" "$flag" "$OUT"
          done < candidates2.txt | tee out/B0-cand2.txt

      - name: 3 - 上传
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-output
          path: out/
