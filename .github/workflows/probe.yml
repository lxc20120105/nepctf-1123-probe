name: NepCTF 1123 probe

on:
  push:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 1 - 准备
        run: |
          TC=$(command -v gtimeout || command -v timeout || echo "")
          echo "TC=$TC" >> $GITHUB_ENV
          mkdir -p out
          xattr -cr bin/ 2>&1 || true
          codesign -s - --force bin/challenge.bin 2>&1 || true
          chmod +x bin/challenge.bin
          sudo softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
          cat > bpcmd.py <<'PYEOF'
          import lldb, sys
          def on_write(frame, bp_loc, dict):
              x0 = frame.FindRegister("x0").GetValueAsUnsigned()
              x1 = frame.FindRegister("x1").GetValueAsUnsigned()
              x2 = frame.FindRegister("x2").GetValueAsUnsigned()
              if x0 <= 2 or x2 > 64:
                  return False
              proc = frame.GetThread().GetProcess()
              err = lldb.SBError()
              data = proc.ReadMemory(x1, x2, err)
              hexs = data.hex() if not err.Fail() else 'READ_ERR'
              print('WRITE fd=%d n=%d %s' % (x0, x2, hexs))
              sys.stdout.flush()
              return False
          PYEOF

      - name: 2 - 差分实验 (改变 flag 首字节看数据如何变)
        continue-on-error: true
        run: |
          set +e
          run_case() {
            echo "=== FLAG: $1 ==="
            ${TC:+$TC 200} lldb -b \
              -o "command script import bpcmd.py" \
              -o "target create bin/challenge.bin" \
              -o "breakpoint set --name ptrace" \
              -o "process launch -- '$1'" \
              -o "thread return 0" \
              -o "breakpoint delete 1" \
              -o "breakpoint set --name write" \
              -o "breakpoint command add --script-type python -F bpcmd.on_write 2" \
              -o "continue" 2>&1 | grep -E "^WRITE|Access|usage"
          }
          run_case 'NepCTF{00000000000000000000000000000000}' | tee out/60-diff.txt
          run_case 'NepCTF{10000000000000000000000000000000}' | tee -a out/60-diff.txt
          run_case 'NepCTF{01000000000000000000000000000000}' | tee -a out/60-diff.txt
          run_case 'NepCTF{00000000000000000000000000000001}' | tee -a out/60-diff.txt

      - name: 3 - 上传
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-output
          path: out/
