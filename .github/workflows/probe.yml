name: NepCTF 1123 probe

on:
  push:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 1 - 准备
        run: |
          TC=$(command -v gtimeout || command -v timeout || echo "")
          echo "TC=$TC" >> $GITHUB_ENV
          xattr -cr bin/ 2>&1 || true
          codesign -s - --force bin/challenge.bin 2>&1 || true
          chmod +x bin/challenge.bin
          sudo softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
          mkdir -p out

      - name: 2 - 比较点每次命中都 dump (hook ptrace 与 sysctl)
        continue-on-error: true
        run: |
          set +e
          ${TC:+$TC 400} lldb -b \
            -o "target create bin/challenge.bin" \
            -o "breakpoint set --name ptrace" \
            -o "breakpoint command add --script-type command -o 'thread return 0' -o 'continue' 1" \
            -o "breakpoint set --name sysctl" \
            -o "breakpoint command add --script-type command -o 'thread return 0' -o 'continue' 2" \
            -o "breakpoint set --address 0x100002358" \
            -o "breakpoint command add --script-type command -o 'memory read --size 1 --format x --count 16 $x29-0x90' -o 'memory read --size 1 --format x --count 16 $x29-0xb0' -o 'continue' 3" \
            -o "process launch -- 'NepCTF{a986e67dd7e9329e518bdba8805c2d4d}'" \
            -o "process continue" \
            > out/02-cmp-all.txt 2>&1
          echo "--- hits ---"
          grep -c "0x16fdf" out/02-cmp-all.txt || true
          head -c 40000 out/02-cmp-all.txt

      - name: 3 - hook 输出函数看程序打印了什么
        continue-on-error: true
        run: |
          set +e
          ${TC:+$TC 400} lldb -b \
            -o "target create bin/challenge.bin" \
            -o "breakpoint set --name ptrace" \
            -o "breakpoint command add --script-type command -o 'thread return 0' -o 'continue' 1" \
            -o "breakpoint set --name sysctl" \
            -o "breakpoint command add --script-type command -o 'thread return 0' -o 'continue' 2" \
            -o "breakpoint set --name puts" \
            -o "breakpoint command add --script-type command -o 'memory read --size 1 --format c --count 64 $x0' -o 'bt' -o 'continue' 3" \
            -o "breakpoint set --name printf" \
            -o "breakpoint command add --script-type command -o 'memory read --size 1 --format c --count 64 $x0' -o 'bt' -o 'continue' 4" \
            -o "breakpoint set --name write" \
            -o "breakpoint command add --script-type command -o 'memory read --size 1 --format c --count 64 $x1' -o 'register read x2' -o 'continue' 5" \
            -o "process launch -- 'NepCTF{a986e67dd7e9329e518bdba8805c2d4d}'" \
            -o "process continue" \
            > out/03-output.txt 2>&1
          head -c 40000 out/03-output.txt

      - name: 4 - hook strncmp/memcmp 打印比较双方
        continue-on-error: true
        run: |
          set +e
          ${TC:+$TC 400} lldb -b \
            -o "target create bin/challenge.bin" \
            -o "breakpoint set --name ptrace" \
            -o "breakpoint command add --script-type command -o 'thread return 0' -o 'continue' 1" \
            -o "breakpoint set --name sysctl" \
            -o "breakpoint command add --script-type command -o 'thread return 0' -o 'continue' 2" \
            -o "breakpoint set --name strncmp" \
            -o "breakpoint command add --script-type command -o 'memory read --size 1 --format c --count 64 $x0' -o 'memory read --size 1 --format c --count 64 $x1' -o 'register read x2' -o 'continue' 3" \
            -o "breakpoint set --name memcmp" \
            -o "breakpoint command add --script-type command -o 'memory read --size 1 --format x --count 32 $x0' -o 'memory read --size 1 --format x --count 32 $x1' -o 'register read x2' -o 'continue' 4" \
            -o "process launch -- 'NepCTF{a986e67dd7e9329e518bdba8805c2d4d}'" \
            -o "process continue" \
            > out/04-cmpfn.txt 2>&1
          head -c 40000 out/04-cmpfn.txt

      - name: 5 - 上传全部输出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-output
          path: out/
